# =============================================================================
# Stream2Vec — Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout: 10s

# Alerting rules (to be configured)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# --- Scrape targets ---
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Stream2Vec Backend (FastAPI)
  # TODO: Add prometheus-fastapi-instrumentator to backend
  - job_name: 'stream2vec-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Kafka (via JMX exporter)
  # TODO: Configure JMX exporter on Kafka
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka:9308']

  # Spark Master
  # TODO: Configure Spark metrics
  # - job_name: 'spark'
  #   static_configs:
  #     - targets: ['spark-master:4040']

  # Qdrant
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'

  # Node Exporter (host metrics)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
