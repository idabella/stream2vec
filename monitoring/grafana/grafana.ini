# =============================================================================
# Stream2Vec — Grafana Configuration
# =============================================================================

[server]
http_port = 3000
domain = localhost

[security]
# Set via environment variables: GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD
admin_user = admin
admin_password = change-me
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path =

[alerting]
enabled = true

[unified_alerting]
enabled = true

[log]
mode = console
level = info

[analytics]
reporting_enabled = false
check_for_updates = false
