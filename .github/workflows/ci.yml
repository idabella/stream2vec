name: Stream2Vec CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ... (lint, test-spark, test-backend-unit jobs remain unchanged) ...

  test-integration:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env Configuration
        run: |
          cp .env.example .env
          echo "APP_ENV=ci" >> .env
          echo "DEBUG=true" >> .env
          echo "SECRET_KEY=ci_test_secret_key_stream2vec_1234567890" >> .env
          echo "POSTGRES_PASSWORD=stream2vec_dev_pass" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://stream2vec:stream2vec_dev_pass@postgres:5432/stream2vec" >> .env
          echo "AIRFLOW_DB_PASSWORD=airflow_dev_pass" >> .env
          echo "MINIO_ACCESS_KEY=minio_admin" >> .env
          echo "MINIO_SECRET_KEY=minio_dev_password" >> .env
          echo "AIRFLOW_FERNET_KEY=LG16KJNqRWytnvS4qSwOjuO-Dc5-ApGs8OZN6l1iHdI=" >> .env
          echo "AIRFLOW_SECRET_KEY=284af4275cf45853f8bf319d309c540baf5b1eeaf9906205af27a28b6be234f1" >> .env
          echo "AIRFLOW_ADMIN_PASSWORD=admin_dev_pass" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=grafana_dev_pass" >> .env
          echo "KAFKA_CLUSTER_ID=25J7Z2HPS2e5k72M7Ac67w" >> .env
          echo "BACKEND_WORKERS=1" >> .env

      - name: Verify .env
        run: cat .env

      - name: Build and Start Services
        run: |
          docker compose up -d postgres minio kafka qdrant backend

      - name: Wait for Postgres to be Healthy
        run: |
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready -U stream2vec -d stream2vec; do echo "Waiting for postgres..."; sleep 5; done'

      - name: Wait for Backend to be Healthy
        run: |
          timeout 120s bash -c 'until docker compose exec -T backend curl -sf http://localhost:8000/health; do echo "Waiting for backend..."; sleep 5; done'

      - name: Check Backend Logs (on failure)
        if: failure()
        run: |
          docker compose logs backend

      - name: Run Integration & E2E Tests
        run: |
          docker compose exec -T backend pytest tests/ -v

      - name: Collect Logs (on failure)
        if: failure()
        run: |
          echo "=== Backend Logs ===" && docker compose logs backend
          echo "=== Postgres Logs ===" && docker compose logs postgres
          echo "=== Kafka Logs ===" && docker compose logs kafka

      - name: Stop Services
        if: always()
        run: |
          docker compose down -v

  # ... (docker-build job remains unchanged) ...
